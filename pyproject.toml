[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pyregtools"
version = "0.1.0"
description = "Python tools for regularized discrete inverse problems"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "scipy",
    "matplotlib",
    "scikit-learn",
    "cvxpy",
]

[project.optional-dependencies]
test = [
    "pytest",
]

docs = [
    "sphinx",
    "numpydoc",
    "furo",
]

[tool.setuptools.packages.find]
where = ["src"]